<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b14"/>
      <stop offset="0.55" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#2a1245"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.45" stop-color="#bb9af7"/>
      <stop offset="0.75" stop-color="#f7768e"/>
      <stop offset="1" stop-color="#ff9e64"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#0e0e14"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="sunclip">
      <rect x="0" y="0" width="1600" height="330"/>
    </clipPath>
    <mask id="stripes">
      <rect x="0" y="0" width="1600" height="520" fill="white"/>
      <rect x="0" y="228" width="1600" height="4" fill="black"/>
      <rect x="0" y="252" width="1600" height="6" fill="black"/>
      <rect x="0" y="278" width="1600" height="8" fill="black"/>
      <rect x="0" y="304" width="1600" height="11" fill="black"/>
    </mask>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#c0caf5" opacity="0.7">
    <circle cx="120" cy="60" r="1.6"/><circle cx="310" cy="120" r="1.2"/><circle cx="480" cy="40" r="1.8"/>
    <circle cx="640" cy="150" r="1.1"/><circle cx="900" cy="70" r="1.5"/><circle cx="1130" cy="30" r="1.2"/>
    <circle cx="1260" cy="110" r="1.7"/><circle cx="1420" cy="60" r="1.3"/><circle cx="1540" cy="140" r="1.5"/>
    <circle cx="220" cy="180" r="1.0"/><circle cx="1040" cy="170" r="1.3"/><circle cx="1350" cy="190" r="1.0"/>
    <circle cx="60" cy="130" r="1.1"/><circle cx="760" cy="20" r="1.2"/><circle cx="1490" cy="20" r="1.0"/>
  </g>

  <!-- sun -->
  <g clip-path="url(#sunclip)" mask="url(#stripes)">
    <circle cx="800" cy="330" r="215" fill="url(#sun)" filter="url(#glow)"/>
  </g>

  <!-- floor -->
  <rect x="0" y="330" width="1600" height="190" fill="url(#floor)"/>
  <line x1="0" y1="330" x2="1600" y2="330" stroke="#bb9af7" stroke-width="2" filter="url(#softglow)"/>
  <g stroke="url(#grid)" stroke-width="1.5">
    <line x1="800" y1="330" x2="800" y2="520"/>
    <line x1="800" y1="330" x2="1000" y2="520"/><line x1="800" y1="330" x2="600" y2="520"/>
    <line x1="800" y1="330" x2="1240" y2="520"/><line x1="800" y1="330" x2="360" y2="520"/>
    <line x1="800" y1="330" x2="1600" y2="520"/><line x1="800" y1="330" x2="0" y2="520"/>
    <line x1="800" y1="330" x2="1600" y2="440"/><line x1="800" y1="330" x2="0" y2="440"/>
    <line x1="800" y1="330" x2="1600" y2="380"/><line x1="800" y1="330" x2="0" y2="380"/>
    <line x1="0" y1="348" x2="1600" y2="348"/>
    <line x1="0" y1="372" x2="1600" y2="372"/>
    <line x1="0" y1="404" x2="1600" y2="404"/>
    <line x1="0" y1="446" x2="1600" y2="446"/>
    <line x1="0" y1="500" x2="1600" y2="500"/>
  </g>

  <!-- title -->
  <text x="800" y="286" text-anchor="middle" font-family="CaskaydiaMono Nerd Font, Menlo, monospace" font-weight="700" font-size="150" fill="#0b0b14" opacity="0.55" filter="url(#glow)">omacos</text>
  <text x="800" y="286" text-anchor="middle" font-family="CaskaydiaMono Nerd Font, Menlo, monospace" font-weight="700" font-size="150" fill="#c0caf5" stroke="#7aa2f7" stroke-width="2" filter="url(#softglow)">omacos</text>
  <text x="800" y="420" text-anchor="middle" font-family="CaskaydiaMono Nerd Font, Menlo, monospace" font-size="30" fill="#c0caf5" letter-spacing="8" filter="url(#softglow)">OMARCHY LOOK &amp; FEEL ON MACOS</text>
</svg>
